name: 研修リポジトリの払い出し
description: 受講用のプライベートリポジトリを自動作成します
# タイトル欄は Issue Forms では非表示にできないため、既定値を入れて入力不要にする。
# 送信後、ワークフローがアカウント名を含む正式なタイトルへ書き換える。
title: 研修用リポジトリ作成依頼
labels: ["enroll"]
body:
  - type: markdown
    attributes:
      value: |
        このフォームを送信すると、`comvace-it-solution` 内にあなた専用の
        **プライベートリポジトリ** が自動作成されます。
        リポジトリを見られるのは **あなたと研修担当者のみ** です。

        > **タイトル欄はそのままで構いません。** 送信後に自動で設定されます。

        ### 登録までの流れ

        | | |
        | --- | --- |
        | 1 | **お名前欄にフルネームを入力**します |
        | 2 | **確認欄にチェック**を入れます |
        | 3 | 「受け付けました」というコメントが付きます |
        | 4 | **そのまま 1 分ほど待ちます**（ページを閉じても処理は進みます） |
        | 5 | 同じコメントが「完了」に変わります |
        | 6 | GitHub から届く**招待を承認**します |
        | 7 | 表示された **SSH URL をコピー**します |
        | 8 | オンクラスに戻って環境構築を進めます |

        コメントが変わらないときは、ページを再読み込みしてください。

  - type: dropdown
    id: course
    attributes:
      label: コース
      description: 受講するコースを選択してください
      options:
        - frontend-basic
    validations:
      required: true

  - type: input
    id: display_name
    attributes:
      label: お名前
      description: フルネームを入力してください（研修担当者が受講者を識別するために使います）
      placeholder: 山田 太郎
    validations:
      required: true

  - type: checkboxes
    id: ack
    attributes:
      label: 確認事項
      options:
        # 払い出し先はログイン中のアカウントに固定されるため、ここで取り違えを防ぐ
        - label: 研修で使う GitHub アカウントでログインしていることを確認しました
          required: true
